# Step3ActionCtx — "I'll do this later" replaces the route with (tabs)/collections
# instead of claiming. Signed out that tab is gated, so the sign-in popup is the
# expected destination (AGENTS.md §4).
appId: ${APP_ID}
name: Claim screen do-this-later link leaves without claiming
tags:
  - needs-tag
  - signed-out
env:
  APP_ID: com.subratadasdev1.hitboxstatic
---
- runFlow: ../../common/goto-discover.yaml
- runFlow: ../../common/open-scan.yaml
- runFlow:
    file: ../../common/scan-manual-tag.yaml
    env:
      TAG_ID: ${TAG_UNCLAIMED}
      ACTION: Claim
- extendedWaitUntil:
    visible: ".*ready to be added to your collection.*"
    timeout: 30000
# The action stack sits below the feature grid, off the first screenful.
- runFlow:
    file: ../../common/scroll-to.yaml
    env:
      TARGET: ".*do this later.*"
- tapOn: ".*do this later.*"
- extendedWaitUntil:
    notVisible: "Claim My Item"
    timeout: 20000
- assertNotVisible: "Go to My Collection"
