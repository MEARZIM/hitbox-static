# AGENTS.md §8 — ProductVerifiedScreen renders ONLY when the tag verified AND the
# product is still unclaimed. Reaching it must not claim anything: verification is
# read-only, and the claim + ledger write happens only when the button is pressed.
#
# Needs TAG_UNCLAIMED — a tag registered on the backend whose product is UNCLAIMED.
appId: ${APP_ID}
name: A verified unclaimed tag shows the claim screen without claiming
tags:
  - needs-tag
  - signed-out
env:
  APP_ID: com.subratadasdev1.hitboxstatic
---
- runFlow: ../../common/goto-discover.yaml
- runFlow: ../../common/open-scan.yaml
- runFlow:
    file: ../../common/scan-manual-tag.yaml
    env:
      TAG_ID: ${TAG_UNCLAIMED}
      ACTION: Claim
- extendedWaitUntil:
    visible: ".*ready to be added to your collection.*"
    timeout: 30000
- assertVisible: "Verification"
- assertVisible: "Authentic"
- assertNotVisible: "Already claimed"
# The Claim button sits below the feature grid, off the first screenful.
- runFlow:
    file: ../../common/scroll-to.yaml
    env:
      TARGET: "Claim My Item"
# Signed out, the button subtitle asks for sign-in rather than promising a claim.
- assertVisible: "Sign in to claim this item"
- assertVisible: ".*do this later.*"
# Nothing was claimed by merely arriving here.
- assertNotVisible: "Go to My Collection"
- takeScreenshot: claim-verified-unclaimed
