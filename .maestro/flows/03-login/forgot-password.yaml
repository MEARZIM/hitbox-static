# AGENTS.md §4 — (auth)/forget-password. The screen is a three-step machine:
# email → OTP → new password (VerifyEmail → OtpVerification → ChangePasswordSection).
#
# Only the entry step is asserted here; sending the code is a live email, covered
# by forgot-password-send-code.yaml.
appId: ${APP_ID}
name: Forgot password is reachable from the sign-in dialog
tags:
  - smoke
  - signed-out
env:
  APP_ID: com.subratadasdev1.hitboxstatic
---
- runFlow: ../../common/launch-clean.yaml
- scrollUntilVisible:
    element:
      text: ".*have an account.*"
    direction: DOWN
- tapOn: "Sign In"
- tapOn: "Continue with Email"
- assertVisible: "Sign In with Email"
- tapOn: ".*Forgot Password.*"
- extendedWaitUntil:
    visible: "Send Code"
    timeout: 20000
- assertVisible: "Enter your email"
- takeScreenshot: forgot-password
