# AGENTS.md §6 — errors come from the Clerk error, not invented copy. An address
# with no account maps to a specific message in EmailLogin (isAccountNotFound →
# "No account found with this email").
#
# Hits Clerk, but only with a throwaway address that cannot succeed, so nothing
# is created and nothing is emailed.
appId: ${APP_ID}
name: Login with an unknown email keeps the dialog open and shows an error
tags:
  - smoke
  - signed-out
env:
  APP_ID: com.subratadasdev1.hitboxstatic
  UNKNOWN_EMAIL: no-such-user-maestro@example.com
  ANY_PASSWORD: NotARealPassword1!
---
- runFlow: ../../common/launch-clean.yaml
- scrollUntilVisible:
    element:
      text: ".*have an account.*"
    direction: DOWN
- tapOn: "Sign In"
- tapOn: "Continue with Email"
- assertVisible: "Sign In with Email"
- tapOn: "Enter your email"
- inputText: ${UNKNOWN_EMAIL}
- tapOn: "Enter your password"
- inputText: ${ANY_PASSWORD}
# Enter dismisses the keyboard; `hideKeyboard` presses BACK on Android, which
# pops the route or closes the dialog underneath.
- pressKey: Enter
- tapOn: "Sign In"
# Any Clerk rejection keeps the dialog open — the app must not navigate away.
- extendedWaitUntil:
    visible: "Sign In with Email"
    timeout: 20000
- assertNotVisible: "Explore collections, creators and exclusive experiences."
- takeScreenshot: login-invalid-credentials
