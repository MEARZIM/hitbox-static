# Full reset-code request — sends a real Clerk email, so `live`. Supply an EMAIL
# that actually has an account, otherwise Clerk rejects the request.
appId: ${APP_ID}
name: Forgot password sends a reset code and shows the OTP step
tags:
  - live
  - signed-out
env:
  APP_ID: com.subratadasdev1.hitboxstatic
---
- runFlow: ../../common/launch-clean.yaml
- scrollUntilVisible:
    element:
      text: ".*have an account.*"
    direction: DOWN
- tapOn: "Sign In"
- tapOn: "Continue with Email"
- tapOn: ".*Forgot Password.*"
- extendedWaitUntil:
    visible: "Send Code"
    timeout: 20000
- tapOn: "Enter your email"
- inputText: ${EMAIL}
# Enter dismisses the keyboard; `hideKeyboard` presses BACK on Android, which
# pops the route or closes the dialog underneath.
- pressKey: Enter
- tapOn: "Send Code"
- extendedWaitUntil:
    visible: "Verify Code"
    timeout: 30000
- assertVisible: "Verify Identity"
